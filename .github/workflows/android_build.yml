name: Cloud Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          # The wildcard catches the universal APK and all architecture splits
          path: app/build/outputs/apk/**/*.apk
